[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "company-deep-research"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.9,<3", "pydantic-settings>=2.5,<3", "httpx>=0.27,<1", "langgraph>=1,<2", "langgraph-checkpoint-sqlite>=3,<4", "python-docx>=1.1,<2", "pypdf>=5,<7", "openpyxl>=3.1,<4", "beautifulsoup4>=4.12,<5", "PyYAML>=6,<7", "reportlab>=4,<6"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
company_research = ["prompts/*.txt", "templates/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]
